[package]
name = "ninja-launcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "launcher"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
